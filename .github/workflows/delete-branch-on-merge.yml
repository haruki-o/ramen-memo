name: Delete branch on merge to release

on:
  pull_request:
    types:
      - closed

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // デフォルトブランチ・保護ブランチは削除しない
            const exactProtected = ['main', 'master', 'develop'];
            const protectedPrefixes = ['release/', 'feature/'];
            const isProtected =
              exactProtected.includes(branch) ||
              protectedPrefixes.some(prefix => branch.startsWith(prefix) && branch === context.payload.pull_request.base.ref);
            if (isProtected) {
              console.log(`Branch "${branch}" is protected. Skipping deletion.`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              console.log(`Branch "${branch}" has been deleted.`);
            } catch (error) {
              console.error(`Failed to delete branch "${branch}": ${error.message}`);
              core.setFailed(error.message);
            }
